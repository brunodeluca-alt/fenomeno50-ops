      var btn = document.createElement("div");
      btn.style.cssText = "pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:9px;background:"+cfg.cor+";color:#fff;font-weight:800;font-size:13px;letter-spacing:.2px;padding:11px 18px;border-radius:999px;box-shadow:0 6px 22px rgba(0,0,0,.5);font-family:-apple-system,sans-serif;animation:fenPulse 2.4s ease-in-out infinite;";
      btn.innerHTML = (n>0 ? '<span style="font-size:15px">🔍</span> Explorar '+n+' '+(n===1?'peça':'peças')+' <span style="opacity:.85">→</span>' : '<span style="font-size:15px">⤢</span> Ver em tela cheia');
      cta.appendChild(btn);
      wrap.appendChild(cta);

      var open = function(e){ e.stopPropagation(); openViewer(key, img.src); };
      btn.addEventListener("click", open);
      img.addEventListener("click", open);
    });
  }

  // ===== VIEWER IMERSIVO =====
  var V = null;        // overlay root
  var stage = null;    // elemento transformado (zoom/pan)
  var imgEl = null;
  var scale = 1, tx = 0, ty = 0;
  var minScale = 1, maxScale = 4;
  var curKey = null;
  var pinEls = [];
  var natW = 0, natH = 0;

  function applyTransform(animate){
    stage.style.transition = animate ? "transform .42s cubic-bezier(.22,.61,.36,1)" : "none";
    stage.style.transform = "translate("+tx+"px,"+ty+"px) scale("+scale+")";
  }

  function clampPan(){
    var vw = V.clientWidth, vh = stageWrap.clientHeight;
    var cw = imgEl.clientWidth * scale, ch = imgEl.clientHeight * scale;
    var maxX = Math.max(0, (cw - vw)/2), maxY = Math.max(0, (ch - vh)/2);
    tx = Math.max(-maxX, Math.min(maxX, tx));
    ty = Math.max(-maxY, Math.min(maxY, ty));
  }

  var stageWrap = null;

  function openViewer(key, src){
    curKey = key;
    var cfg = PANELS[key];
    document.body.style.overflow = "hidden";

    V = document.createElement("div");
    V.style.cssText = "position:fixed;inset:0;z-index:99999;background:#08080A;display:flex;flex-direction:column;font-family:-apple-system,sans-serif;animation:fenFade .25s ease;";

    // HEADER
    var head = document.createElement("div");
    head.style.cssText = "flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(rgba(0,0,0,.6),transparent);position:relative;z-index:5;";
    head.innerHTML = '<div><div style="font-size:11px;font-weight:800;letter-spacing:1.5px;color:'+cfg.cor+'">'+cfg.ato+'</div><div style="font-size:17px;font-weight:800;color:#fff;margin-top:1px">'+cfg.titulo+'</div></div>';
    var close = document.createElement("div");
    close.style.cssText = "cursor:pointer;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0;";
    close.innerHTML = "✕";
    close.addEventListener("click", closeViewer);
    head.appendChild(close);
    V.appendChild(head);

    // STAGE (zoom/pan)
    stageWrap = document.createElement("div");
    stageWrap.style.cssText = "flex:1;position:relative;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;";
    stage = document.createElement("div");
    stage.style.cssText = "position:relative;transform-origin:center center;will-change:transform;";
    imgEl = document.createElement("img");
    imgEl.src = src;
    imgEl.style.cssText = "display:block;max-width:100vw;max-height:100%;width:auto;height:auto;-webkit-user-select:none;user-select:none;pointer-events:none;";
    stage.appendChild(imgEl);
    stageWrap.appendChild(stage);
    V.appendChild(stageWrap);

    // dica de gesto
    var hint = document.createElement("div");
    hint.style.cssText = "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;z-index:6;pointer-events:none;display:flex;align-items:center;gap:8px;animation:fenFade .4s ease;";
    hint.innerHTML = (cfg.pins.length>0 ? '👆 Toque nos números · pinça pra ampliar' : '🤏 Pinça pra ampliar · arraste pra mover');
    stageWrap.appendChild(hint);
    setTimeout(function(){ hint.style.transition="opacity .5s"; hint.style.opacity="0"; setTimeout(function(){ if(hint.parentNode) hint.remove(); }, 500); }, 2600);

    // FILM STRIP (peças)
    var strip = null;
    if (cfg.pins.length > 0){
      strip = document.createElement("div");
      strip.style.cssText = "flex-shrink:0;display:flex;gap:8px;overflow-x:auto;padding:12px 14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.55));-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;z-index:5;";
      cfg.pins.forEach(function(p, i){
        var chip = document.createElement("div");
        chip.dataset.idx = i;
        chip.style.cssText = "flex-shrink:0;cursor:pointer;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 13px 9px 9px;transition:all .2s;max-width:230px;";
        chip.innerHTML = '<div style="flex-shrink:0;width:26px;height:26px;border-radius:50%;background:'+cfg.cor+';color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center">'+(i+1)+'</div><div style="font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+p.t+'</div>';
        chip.addEventListener("click", function(){ selectPin(i); });
        strip.appendChild(chip);
      });
      V.appendChild(strip);
    }
    V.__strip = strip;

    // CARD (história da peça)
    var card = document.createElement("div");
    card.style.cssText = "position:absolute;left:12px;right:12px;bottom:92px;max-height:62%;overflow-y:auto;background:#141414;border:1px solid rgba(255,255,255,.1);border-left:3px solid "+cfg.cor+";border-radius:14px;padding:15px 16px;box-shadow:0 12px 40px rgba(0,0,0,.7);z-index:7;transform:translateY(20px);opacity:0;transition:all .3s ease;-webkit-overflow-scrolling:touch;";
    V.appendChild(card);
    V.__card = card;

    document.body.appendChild(V);

    // estado inicial
    scale = 1; tx = 0; ty = 0;
    imgEl.onload = function(){ natW = imgEl.naturalWidth; natH = imgEl.naturalHeight; buildPins(); applyTransform(false); };
    if (imgEl.complete) { natW = imgEl.naturalWidth; natH = imgEl.naturalHeight; buildPins(); applyTransform(false); }

    setupGestures();
  }

  function buildPins(){
    pinEls.forEach(function(p){ if(p.parentNode) p.remove(); });
    pinEls = [];
    var cfg = PANELS[curKey];
    cfg.pins.forEach(function(p, i){
      var dot = document.createElement("div");
      dot.style.cssText = "position:absolute;left:"+p.x+"%;top:"+p.y+"%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;background:"+cfg.cor+";color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2.5px solid #fff;box-shadow:0 2px 12px rgba(0,0,0,.7);z-index:8;animation:fenPing 2s ease-in-out infinite;";
      dot.textContent = (i+1);
      dot.addEventListener("click", function(e){ e.stopPropagation(); selectPin(i); });
      stage.appendChild(dot);
      pinEls.push(dot);
    });
  }

  function selectPin(i){
    var cfg = PANELS[curKey];
    var p = cfg.pins[i];

    // destacar pin ativo, esmaecer os outros (efeito holofote)
    pinEls.forEach(function(el, j){
      el.style.animation = "none";
      el.style.opacity = (j===i) ? "1" : "0.35";
      el.style.transform = "translate(-50%,-50%) scale("+(j===i?1.25:1)+")";
      el.style.boxShadow = (j===i) ? "0 0 0 6px "+cfg.cor+"55, 0 2px 12px rgba(0,0,0,.7)" : "0 2px 12px rgba(0,0,0,.7)";
    });
    // destacar chip ativo
    if (V.__strip){
      Array.prototype.forEach.call(V.__strip.children, function(chip, j){
        chip.style.background = (j===i) ? cfg.cor+"22" : "rgba(255,255,255,.08)";
        chip.style.borderColor = (j===i) ? cfg.cor : "rgba(255,255,255,.14)";
      });
      var active = V.__strip.children[i];
      if (active) active.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
    }

    // zoom + pan pra centralizar a peça
    var z = 2.1;
    var vw = V.clientWidth, vh = stageWrap.clientHeight;
    var iw = imgEl.clientWidth, ih = imgEl.clientHeight;
    // ponto da peça em px relativo ao centro da imagem
    var px = (p.x/100 - 0.5) * iw;
    var py = (p.y/100 - 0.5) * ih;
    scale = z;
    tx = -px * z;
    ty = -py * z;
    clampPan();
    applyTransform(true);

    // card com a história + foto real (quando existe)
    var card = V.__card;
    var foto = getFoto(p.fid);
    var fotoHTML = foto
      ? '<img src="'+foto+'" style="width:100%;max-height:180px;object-fit:contain;border-radius:10px;margin-bottom:11px;background:#000;display:block">'
      : '<div style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.18);border-radius:10px;padding:10px 12px;margin-bottom:11px;font-size:11.5px;color:#8A8A8A"><span style="font-size:14px">📷</span> Foto da peça no acervo em breve · use o zoom pra ver na arte</div>';
    card.innerHTML = fotoHTML + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px"><div style="flex-shrink:0;width:22px;height:22px;border-radius:50%;background:'+cfg.cor+';color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center">'+(i+1)+'</div><div style="font-size:14px;font-weight:800;color:#fff">'+p.t+'</div></div><div style="font-size:13px;line-height:1.55;color:#C8C8C8">'+p.s+'</div>';
    card.style.transform = "translateY(0)";
    card.style.opacity = "1";
  }

  function setupGestures(){
    var dragging=false, lastX=0, lastY=0;
    var pinching=false, startDist=0, startScale=1;

    function dist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }

    stageWrap.addEventListener("touchstart", function(e){
      if (e.touches.length===2){ pinching=true; startDist=dist(e.touches); startScale=scale; }
      else if (e.touches.length===1){ dragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }
    }, {passive:false});

    stageWrap.addEventListener("touchmove", function(e){
      e.preventDefault();
      if (pinching && e.touches.length===2){
        var d = dist(e.touches);
        scale = Math.max(minScale, Math.min(maxScale, startScale * (d/startDist)));
        clampPan(); applyTransform(false);
      } else if (dragging && e.touches.length===1 && scale>1){
        var nx=e.touches[0].clientX, ny=e.touches[0].clientY;
        tx += (nx-lastX); ty += (ny-lastY);
        lastX=nx; lastY=ny;
        clampPan(); applyTransform(false);
      }
    }, {passive:false});

    stageWrap.addEventListener("touchend", function(e){
      if (e.touches.length===0){ dragging=false; pinching=false; }
    });

    // duplo-toque: zoom in/out
    var lastTap=0;
    stageWrap.addEventListener("touchend", function(e){
      var now=Date.now();
      if (now-lastTap < 300 && e.changedTouches.length){
        if (scale>1.2){ scale=1; tx=0; ty=0; } else { scale=2.2; }
        clampPan(); applyTransform(true);
      }
      lastTap=now;
    });

    // desktop: scroll = zoom, drag = pan
    stageWrap.addEventListener("wheel", function(e){
      e.preventDefault();
      scale = Math.max(minScale, Math.min(maxScale, scale - e.deltaY*0.002));
      clampPan(); applyTransform(false);
    }, {passive:false});
    var mDown=false, mx=0, my=0;
    stageWrap.addEventListener("mousedown", function(e){ if(scale>1){mDown=true;mx=e.clientX;my=e.clientY;} });
    window.addEventListener("mousemove", function(e){ if(mDown){ tx+=(e.clientX-mx); ty+=(e.clientY-my); mx=e.clientX; my=e.clientY; clampPan(); applyTransform(false);} });
    window.addEventListener("mouseup", function(){ mDown=false; });
  }

  function closeViewer(){
    document.body.style.overflow = "";
    if (V && V.parentNode) V.remove();
    V=null; stage=null; imgEl=null; pinEls=[]; scale=1; tx=0; ty=0;
  }

  // estilos de animação
  var st = document.createElement("style");
  st.textContent = "@keyframes fenPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes fenPing{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.5),0 2px 12px rgba(0,0,0,.7)}50%{box-shadow:0 0 0 7px rgba(255,255,255,0),0 2px 12px rgba(0,0,0,.7)}}@keyframes fenFade{from{opacity:0}to{opacity:1}}";
  document.head.appendChild(st);

  var obs = new MutationObserver(enhance);
  obs.observe(document.body, {childList:true, subtree:true});
  setTimeout(enhance, 700);
  setTimeout(enhance, 1800);
})();

</script>
</body>
