<script>
(function() {
  // ====== DADOS DOS HOTSPOTS ======
  // x,y em % da imagem. cor = cor do ATO. label = texto do pin
  var PINS = {
    "painel02": {cor:"#3B82F6", pins:[
      {x:43, y:38, label:"Medalha 2° Artilheiro Infantil\nSão Cristóvão F.C. · 1991"},
      {x:34, y:25, label:"Valqueire Tênis Clube · 1987\nPrimeiros testes"},
      {x:59, y:22, label:"Artilheiro Infantil S. Cristóvão\nMedalhas da infância"},
      {x:80, y:23, label:"Estreia no Cruzeiro · 1993\nTroféu Fato do Ano 93"},
      {x:63, y:60, label:"Santinho autografado pelo Zico\n★ Peça histórica"},
      {x:84, y:68, label:"Troféu ÚNICO NO MUNDO\nFato do Ano 93 — Cruzeiro"}
    ]},
    "painel03": {cor:"#22C55E", pins:[
      {x:70, y:22, label:"FIFA World Player 1996 + 1997\nDois títulos consecutivos"},
      {x:86, y:19, label:"Ballon d\'Or 1997\nMaleta alumínio original"},
      {x:74, y:75, label:"Camisa Inter de Milão\nMedalhas UEFA Cup + Coppa Italia"}
    ]},
    "painel04": {cor:"#22C55E", pins:[
      {x:10, y:42, label:"Medalha Prata Copa 1998\nFinal em Paris · 0×3"},
      {x:36, y:35, label:"Chuteira Nike Mercurial\nÉpoca da 1ª lesão grave"}
    ]},
    "painel05": {cor:"#F59E0B", pins:[
      {x:50, y:17, label:"Chuteiras Nike Amarelas\nFinal Yokohama · 30 jun 2002\n★ PEÇA ÂNCORA"},
      {x:58, y:55, label:"Medalha Ouro Penta + Ballon d\'Or 2002\nFIFA World Player 2002"},
      {x:82, y:25, label:"Real Madrid · Supercopa España 2003\nTrofeo EFE + Chuteiras R9"},
      {x:92, y:28, label:"Chuteira de Bronze Copa 2006\n15 gols — recorde histórico"}
    ]},
    "painel06": {cor:"#A855F7", pins:[
      {x:65, y:18, label:"Lesão AC Milan · fev 2008\nTerceira lesão grave em 10 anos"},
      {x:74, y:52, label:"Ballon d\'Or 2002\nCom Real Madrid"},
      {x:88, y:18, label:"Campeão Paulistão 2009\nCorinthians invicto · Faixa comemorativa"},
      {x:82, y:40, label:"Chuteiras personalizadas\nFilhos bordados: Ronald + Maria Sophia\n★ PAR ÚNICO"}
    ]}
  };

  var activeTooltip = null;

  function pin(x, y, cor, label) {
    var d = document.createElement("div");
    d.style.cssText = "position:absolute;left:"+x+"%;top:"+y+"%;transform:translate(-50%,-50%);width:30px;height:30px;background:"+cor+";border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 14px rgba(0,0,0,.95);z-index:10;font-size:14px;";
    d.textContent = "📍";
    
    var tip = document.createElement("div");
    tip.style.cssText = "display:none;position:absolute;left:"+x+"%;top:"+(Math.min(y+8,88))+"%;transform:translateX(-50%);background:#000;border:1px solid "+cor+";border-radius:8px;padding:9px 13px;font-size:11px;color:#fff;z-index:20;max-width:210px;box-shadow:0 4px 18px rgba(0,0,0,.95);font-family:-apple-system,sans-serif;white-space:pre-line;line-height:1.5;pointer-events:none;";
    tip.textContent = label;
    
    d.addEventListener("click", function(e) {
      e.stopPropagation();
      if (activeTooltip && activeTooltip !== tip) activeTooltip.style.display = "none";
      tip.style.display = tip.style.display === "block" ? "none" : "block";
      activeTooltip = tip.style.display === "block" ? tip : null;
    });
    return [d, tip];
  }

  function applyPins() {
    var imgs = document.querySelectorAll("img[src*=\"brunodeluca-alt.github.io\"]");
    imgs.forEach(function(img) {
      if (img.dataset.pinned) return;
      var fname = img.src.split("/").pop().replace(".jpg","");
      var config = PINS[fname];
      if (!config) return;
      img.dataset.pinned = "1";
      var wrap = img.parentElement;
      if (getComputedStyle(wrap).position === "static") wrap.style.position = "relative";
      // Remover click de zoom no wrapper, mover para a img
      var oldOnClick = wrap.onclick;
      wrap.onclick = null;
      img.style.cursor = "zoom-in";
      img.addEventListener("click", function() { if(oldOnClick) oldOnClick(); });
      
      config.pins.forEach(function(p) {
        var els = pin(p.x, p.y, config.cor, p.label);
        wrap.appendChild(els[0]);
        wrap.appendChild(els[1]);
      });
      
      // Fechar tooltips ao clicar fora
      document.addEventListener("click", function() {
        if (activeTooltip) { activeTooltip.style.display = "none"; activeTooltip = null; }
      });
    });
  }

  // Injetar quando o DOM mudar
  var obs = new MutationObserver(applyPins);
  obs.observe(document.body, {childList:true, subtree:true});
  setTimeout(applyPins, 800);
  setTimeout(applyPins, 2000);
})();
</script>
